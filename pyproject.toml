[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ana-nlp"
version = "1.0.1"
description = "Adaptive Neural Automaton - Advanced SSM with Associative Memory"
authors = [{name = "ANA Research Team", email = "research@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.13.0",
    "pytest>=7.0.0",
    "tqdm>=4.64.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.0.0",
    "umap-learn>=0.5.0",
    "optuna>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
experiments = [
    "datasets",
    "transformers",
    "tiktoken",
]

[project.scripts]
ana-research = "ana.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
